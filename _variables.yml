# Single source of truth for the workshop.
# Pages read these values with {{< var ... >}}; scripts/gen_tables.py and
# scripts/gen_notebooks.py read them to write the generated files.
# Change a title, duration, objective, URL or pin here, then run the generators.

repo:
  owner: project-delphi
  name: nlp-llms
  branch: main
  url: https://github.com/project-delphi/nlp-llms
  site_url: https://project-delphi.github.io/nlp-llms
  colab_base: https://colab.research.google.com/github/project-delphi/nlp-llms/blob/main/notebooks

workshop:
  title: "From Traditional NLP to Modern LLMs"
  subtitle: "n-grams, attention, RLHF, RLCD and agents"
  org: "Genial Labs"
  days: 5

# Model IDs. Checked against each provider's live documentation on 2026-10-04
# (PLAN.md, build day 6). Re-check before each delivery: IDs retire.
# Notebooks cannot read this file on Colab, so they repeat these IDs; a test
# must fail if a notebook and this file disagree.
models:
  openai: "gpt-6-luna"
  anthropic: "claude-haiku-4-5"
  # Open chat model for the no-key path of the API labs (Apache 2.0).
  fallback: "Qwen/Qwen2.5-0.5B-Instruct"
  # Lab 6: masked LM probed (and fine-tuned on GPU), small encoder fine-tuned on
  # a CPU runtime, and causal LM probed. Revisions not yet pinned: the Hub was
  # unreachable from the build container on 2026-10-04.
  encoder: "distilbert/distilbert-base-uncased"
  encoder_cpu: "google/bert_uncased_L-4_H-256_A-4"
  causal_lm: "distilbert/distilgpt2"
  # The commit of causal_lm that Lab 9's preference pairs were sampled from (resolved
  # from main by data/build_lab09_preferences.py on 2026-10-06). Lab 10 loads it.
  causal_lm_revision: "2290a62682d06624634c1f46a6ad5be0f47f38aa"
  # Lab 13: dense retriever, reranker and faithfulness model (open path). IDs and
  # licenses from model-card summaries only; confirm on the Hub and pin revisions.
  embedding: "BAAI/bge-small-en-v1.5"
  reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"
  nli: "cross-encoder/nli-deberta-v3-xsmall"
  # Base (not instruction-tuned) causal LM fine-tuned in Lab 7 (Apache 2.0).
  instruct_base: "HuggingFaceTB/SmolLM2-135M"
  instruct_base_revision: "93efa2f097d58c2a74874c7e644dbc9b0cee75a2"
  # Jev (TypeSafe System One) via typesafe-sdk. "jev-latest" is the SDK default;
  # pin a concrete ID after listing /v1/models with a key.
  jev: "jev-latest"

# Package pins for the TypeSafe labs (12-15). Only these names are official:
# lookalikes on PyPI (typesafe-ai, jev, llama-index-postprocessor-jev, ...) are
# not TypeSafe's. Checked against PyPI and the source repositories.
packages:
  checked: "2026-10-05"
  typesafe_sdk: "0.7.2"
  langchain_typesafe: "0.0.1a3"
  system_one_adapter: "0.2.1"
  # Resolved together with the above for Python 3.12 (Lab 14 brief).
  langgraph: "1.2.12"
  langchain_core: "1.6.6"
  # Lab 13 (read from installed source; docs unreachable from the build container).
  llama_index_core: "0.14.25"
  llama_index_retrievers_bm25: "0.8.0"
  langchain_text_splitters: "1.1.3"

# Terminal coding agents (Module 0, lectures/00-coding-agents.qmd). Versions whose
# --help output and install docs the page was checked against. The page does not
# pin them: each installer fetches the latest release. Re-check before each delivery.
assistants:
  checked: "2026-10-05"
  codex: "0.160.1"
  claude_code: "2.1.289"
  gemini_cli: "0.62.0"

# Colab Secrets names. TYPESAFE_API_KEY verified 2026-10-05 against typesafe-sdk 0.7.2
# and langchain-typesafe 0.0.1a3 (briefs/jev-verification.md).
secrets:
  openai: OPENAI_API_KEY
  anthropic: ANTHROPIC_API_KEY
  typesafe: TYPESAFE_API_KEY

