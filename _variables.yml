# Single source of truth for the workshop.
# Pages read these values with {{< var ... >}}; scripts/gen_tables.py and
# scripts/gen_notebooks.py read them to write the generated files.
# Change a title, duration, objective, URL or pin here, then run the generators.

repo:
  owner: project-delphi
  name: nlp-llms
  branch: main
  url: https://github.com/project-delphi/nlp-llms
  site_url: https://project-delphi.github.io/nlp-llms
  colab_base: https://colab.research.google.com/github/project-delphi/nlp-llms/blob/main/notebooks

workshop:
  title: "From Traditional NLP to Modern LLMs"
  subtitle: "n-grams, attention, RLHF, RLCD and agents"
  org: "Genial Labs"
  days: 4
  lecture_minutes: 45
  lab_minutes: 50

# Model IDs. Checked against each provider's live documentation on 2026-10-04
# (PLAN.md, build day 6). Re-check before each delivery: IDs retire.
# Notebooks cannot read this file on Colab, so they repeat these IDs; a test
# must fail if a notebook and this file disagree.
models:
  openai: "gpt-6-luna"
  anthropic: "claude-haiku-4-5"
  # Open chat model for the no-key path of the API labs (Apache 2.0).
  fallback: "Qwen/Qwen2.5-0.5B-Instruct"
  # Lab 6: masked LM probed (and fine-tuned on GPU), small encoder fine-tuned on
  # a CPU runtime, and causal LM probed. Revisions not yet pinned: the Hub was
  # unreachable from the build container on 2026-10-04.
  encoder: "distilbert/distilbert-base-uncased"
  encoder_cpu: "google/bert_uncased_L-4_H-256_A-4"
  causal_lm: "distilbert/distilgpt2"
  # Lab 13: dense retriever, reranker and faithfulness model (open path). IDs and
  # licenses from model-card summaries only; confirm on the Hub and pin revisions.
  embedding: "BAAI/bge-small-en-v1.5"
  reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"
  nli: "cross-encoder/nli-deberta-v3-xsmall"
  # Base (not instruction-tuned) causal LM fine-tuned in Lab 7 (Apache 2.0).
  instruct_base: "HuggingFaceTB/SmolLM2-135M"
  instruct_base_revision: "93efa2f097d58c2a74874c7e644dbc9b0cee75a2"
  # Jev (TypeSafe System One) via typesafe-sdk. "jev-latest" is the SDK default;
  # pin a concrete ID after listing /v1/models with a key.
  jev: "jev-latest"

# Package pins for the TypeSafe labs (12-15). Only these names are official:
# lookalikes on PyPI (typesafe-ai, jev, llama-index-postprocessor-jev, ...) are
# not TypeSafe's. Checked against PyPI and the source repositories.
packages:
  checked: "2026-10-05"
  typesafe_sdk: "0.7.2"
  langchain_typesafe: "0.0.1a3"
  system_one_adapter: "0.2.1"
  # Resolved together with the above for Python 3.12 (Lab 14 brief).
  langgraph: "1.2.12"
  langchain_core: "1.6.6"
  # Lab 13 (read from installed source; docs unreachable from the build container).
  llama_index_core: "0.14.25"
  llama_index_retrievers_bm25: "0.8.0"
  langchain_text_splitters: "1.1.3"

# Colab Secrets names. TYPESAFE_API_KEY verified 2026-10-05 against typesafe-sdk 0.7.2
# and langchain-typesafe 0.0.1a3 (briefs/jev-verification.md).
secrets:
  openai: OPENAI_API_KEY
  anthropic: ANTHROPIC_API_KEY
  typesafe: TYPESAFE_API_KEY

# Datasets of the running thread. data/README.md explains each choice and gives
# the loading cell that notebooks paste; tests/test_data.py checks that the two
# agree and that the committed copies match these hashes.
# `urls` are tried in order: canonical first, fallback second. An entry with a
# `file` has a copy under data/, served from `fallback_base`.
datasets:
  checked: "2026-10-04"   # date the licenses were read at license_url
  fallback_base: https://raw.githubusercontent.com/project-delphi/nlp-llms/main/data
  topics:
    name: "arXiv Topics v1"
    modules: [1, 2, 6, 11]
    file: arxiv_topics_v1.csv.gz
    urls:
      - https://raw.githubusercontent.com/project-delphi/nlp-llms/main/data/arxiv_topics_v1.csv.gz
      - https://cdn.jsdelivr.net/gh/project-delphi/nlp-llms@main/data/arxiv_topics_v1.csv.gz
    sha256: "49b51502fc6cf6ecff23fa266c5372594a88414dd96513579237792710246dc5"
    bytes: 3172762
    license: "CC0 1.0"
    license_url: https://info.arxiv.org/help/api/tou.html
    classes: [cs.CL, cs.CV, cs.LG, cs.RO]
    class_names: ["Language", "Vision", "Machine learning", "Robotics"]
    seed: 0
    splits: {train: 4800, val: 600, test: 1600}
  lm:
    name: "Tiny Shakespeare"
    modules: [1, 3, 5]
    file: tinyshakespeare.txt
    urls:
      - https://raw.githubusercontent.com/karpathy/char-rnn/6f9487a6fe5b420b7ca9afb0d7c078e37c1d1b4e/data/tinyshakespeare/input.txt
      - https://raw.githubusercontent.com/project-delphi/nlp-llms/main/data/tinyshakespeare.txt
    sha256: "86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed"
    bytes: 1115394
    license: "Public-domain text; MIT packaging"
    license_url: https://github.com/karpathy/char-rnn
    # Character offsets, [start, end).
    splits: {train: [0, 1000000], val: [1000000, 1055000], test: [1055000, 1115394]}
  instructions:
    name: "Databricks Dolly 15k"
    modules: [7]
    # The full upstream file. Lab 7 fixes a subset and adds `file` if it commits one.
    urls:
      - https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a/databricks-dolly-15k.jsonl
    sha256: "2df9083338b4abd6bceb5635764dab5d833b393b55759dffb0959b6fcbf794ec"
    bytes: 13085339
    license: "CC BY-SA 3.0"
    license_url: https://huggingface.co/datasets/databricks/databricks-dolly-15k
    records: 15011
  # Built by data/build_decisions.py (spec: briefs/11-calibration.md). Status
  # "v1-template-only": the 80 hand-written slots hold template items until two
  # people write and label them (data/decisions_v1_stats.json, hand_items: 0).
  # Adding them changes sha256 and bytes below.
  decisions:
    name: "Workshop Desk Decisions v1"
    modules: [11, 12, 14]
    file: decisions_v1.jsonl.gz
    urls:
      - https://raw.githubusercontent.com/project-delphi/nlp-llms/main/data/decisions_v1.jsonl.gz
      - https://cdn.jsdelivr.net/gh/project-delphi/nlp-llms@main/data/decisions_v1.jsonl.gz
    sha256: "56ee7e8b4e7ef418e5da6a9f242f615b21dacd3c5d312c0e4635174847aa0df1"
    bytes: 143499
    license: "CC0 1.0"
    license_url: https://creativecommons.org/publicdomain/zero/1.0/
    families: [policy, route]
    route_options: [retrieve, calculate, send_email, ask_user, escalate]
    seed: 0
    splits: {train: 2000, dev: 100, test: 300}
  # Built by data/build_lectures_corpus.py from lectures 01-12 and references.qmd at
  # `source_commit` (spec: briefs/13-rag.md, decision (a)). references.qmd is complete
  # for Modules 1-15 at this commit. Status stays "provisional" because lecture 12 has a
  # TODO to quote TypeSafe's documentation and lectures 6-11 may change after their
  # Colab T4 runs. Set "final" once lectures 1-12 are frozen, rebuilding first (new
  # sha256, bytes, source_commit, characters) if any page changed; questions come after.
  # tests/test_rag_questions.py fails if data/rag_questions_v1.jsonl exists while
  # this status is provisional, and on any evidence quote a rebuild breaks.
  lectures:
    name: "Workshop Lectures v1"
    modules: [13, 14, 15]
    file: workshop_lectures_v1.jsonl.gz
    urls:
      - https://raw.githubusercontent.com/project-delphi/nlp-llms/main/data/workshop_lectures_v1.jsonl.gz
      - https://cdn.jsdelivr.net/gh/project-delphi/nlp-llms@main/data/workshop_lectures_v1.jsonl.gz
    sha256: "4a7e9310ea5bd9206fce4a42c414d1f942c8880f9e7b694b04f04125fcc2d395"
    bytes: 189037
    license: "CC BY 4.0"
    license_url: https://creativecommons.org/licenses/by/4.0/
    source_commit: "3ba37bc06e2e1f23f7896f43e04117e805b6925e"
    status: "provisional"
    documents: 13
    characters: 544974

# The daily clock. `module` slots take the day's modules in order. The
# `self_serve` slot is optional and unstaffed: it shows a day's `self_serve`
# module and stays empty on days that have none.
schedule:
  slots:
    - {start: "08:00", end: "09:00", kind: self_serve}
    - {start: "09:00", end: "09:10", kind: opening}
    - {start: "09:10", end: "10:45", kind: module}
    - {start: "10:45", end: "11:00", kind: break, label: "Break"}
    - {start: "11:00", end: "12:35", kind: module}
    - {start: "12:35", end: "13:35", kind: break, label: "Lunch"}
    - {start: "13:35", end: "15:10", kind: module}
    - {start: "15:10", end: "15:25", kind: break, label: "Break"}
    - {start: "15:25", end: "17:00", kind: module}

days:
  d1:
    n: 1
    title: "Foundations: from counts to attention"
    short: "Foundations"
    question: "How do we turn text into something a model can learn from?"
    opening: "Welcome, setup check"
    self_serve: {module: m00, label: "Coding agents in the terminal (self-serve)"}
    slots: [m01, m02, m03, m04]
  d2:
    n: 2
    title: "Transformers and LLMs"
    short: "Transformers and LLMs"
    question: "How does one architecture, pretrained at scale, become a general tool?"
    opening: "Recap of Day 1"
    slots: [m05, m06, m07, m08]
  d3:
    n: 3
    title: "Training objectives: preference and calibration"
    short: "Training objectives"
    question: "What are we optimizing these models for, and what should we be?"
    opening: "Recap of Day 2"
    slots: [m09, m10, m11, m12]
  d4:
    n: 4
    title: "RAG, agents and capstone"
    short: "RAG, agents, capstone"
    question: "How do we build reliable systems out of these models?"
    opening: "Recap of Day 3"
    slots:
      - m13
      - m14
      - {module: m15, label: "Capstone: build"}
      - {module: m15, label: "Capstone: evaluate and share, then wrap-up"}

setup:
  slug: 00-setup
  title: "Setup and environment check"
  minutes: 10
  summary: "Check the runtime, load optional API keys from Colab Secrets, and choose a provider."

# Module 0 (coding agents). npm package names, and the version on each package's
# "latest" dist-tag, read from registry.npmjs.org on `checked`. `node` is each
# package's `engines.node`. Claude Code's npm install is deprecated in favor of its
# native installer (code.claude.com/docs/en/setup), which needs no Node.js.
# Re-check before each delivery: these CLIs release several times a week.
agents_intro:
  checked: "2026-10-05"
  threejs: "0.186.1"
  clis:
    claude_code: "@anthropic-ai/claude-code"
    codex: "@openai/codex"
    gemini: "@google/gemini-cli"
  cli_versions:
    claude_code: "2.1.289"
    codex: "0.160.1"
    gemini: "0.62.0"
  node:
    claude_code: ">=22.0.0"
    codex: ">=16"
    gemini: ">=20"

# `notebook: false` marks a module with no Colab lab (Module 0 runs in the
# participant's own terminal). Every other module has notebooks/<slug>.ipynb.
modules:
  m00:
    n: 0
    slug: 00-coding-agents
    day: 1
    minutes: 60
    notebook: false
    title: "Coding agents in the terminal"
    summary: "Install a terminal coding agent and use it to build, check and publish two small data apps in Python or R, each with a three.js page. Self-serve; also works as pre-work."
    objectives:
      - "Install and drive a terminal coding agent"
      - "Build and check two small data apps with it"
      - "Publish them with GitHub and GitHub Pages"
    stack: [Claude Code, Codex, Gemini CLI, git, GitHub CLI, Python or R, three.js]
  m01:
    n: 1
    slug: 01-text-as-data
    day: 1
    minutes: 95
    title: "Text as data"
    summary: "Tokenization, n-gram language models, TF-IDF and linear classifiers: the count-based baseline everything else is measured against."
    objectives:
      - "Tokenize text and justify the choices"
      - "Build and evaluate an n-gram language model"
      - "Train a linear text classifier and read its errors"
    stack: [NumPy, scikit-learn]
  m02:
    n: 2
    slug: 02-word-vectors
    day: 1
    minutes: 95
    title: "Word vectors and neural networks"
    summary: "From one-hot vectors to learned embeddings, with a PyTorch refresher and the first neural language model."
    objectives:
      - "Explain the distributional hypothesis"
      - "Derive the skip-gram objective with negative sampling"
      - "Train embeddings and a feed-forward classifier in PyTorch"
    stack: [PyTorch]
  m03:
    n: 3
    slug: 03-sequence-models
    day: 1
    minutes: 95
    title: "Sequence models"
    summary: "RNNs, LSTMs and neural language modeling, and why gradients vanish over long sequences."
    objectives:
      - "Implement an RNN and an LSTM language model"
      - "Explain vanishing gradients and how gating addresses them"
      - "Compare perplexity against the n-gram baseline"
    stack: [PyTorch]
  m04:
    n: 4
    slug: 04-seq2seq-attention
    day: 1
    minutes: 95
    title: "Seq2seq and attention"
    summary: "Encoder-decoder models, the fixed-vector bottleneck, and attention as the fix."
    objectives:
      - "Build an encoder-decoder model"
      - "Explain the fixed-vector bottleneck"
      - "Implement additive and dot-product attention and read attention maps"
    stack: [PyTorch]
  m05:
    n: 5
    slug: 05-transformer-from-scratch
    day: 2
    minutes: 95
    title: "The transformer"
    summary: "Self-attention, multi-head attention and positional encodings, assembled into a small GPT."
    objectives:
      - "Implement scaled dot-product and multi-head self-attention"
      - "Assemble a decoder-only transformer"
      - "Train a small GPT and compare it with the LSTM"
    stack: [PyTorch]
  m06:
    n: 6
    slug: 06-pretraining-huggingface
    day: 2
    minutes: 95
    title: "Pretraining and the Hugging Face stack"
    summary: "Subword tokenization, masked and causal pretraining, and using pretrained models through Hugging Face."
    objectives:
      - "Explain subword tokenization and the masked and causal pretraining objectives"
      - "Load, inspect and run pretrained models with Hugging Face"
      - "Fine-tune an encoder for classification"
    stack: [Hugging Face, PyTorch]
  m07:
    n: 7
    slug: 07-finetuning-lora
    day: 2
    minutes: 95
    title: "Fine-tuning and LoRA"
    summary: "Turning a pretrained language model into an instruction follower, efficiently."
    objectives:
      - "Turn a pretrained causal LM into an instruction follower"
      - "Apply LoRA and explain why it works"
      - "Choose decoding settings and evaluate generated text"
    stack: [Hugging Face, PEFT, PyTorch]
  m08:
    n: 8
    slug: 08-llm-apis
    day: 2
    minutes: 95
    title: "LLMs through APIs"
    summary: "OpenAI and Claude side by side: prompting, structured output, tool use, cost and evaluation."
    objectives:
      - "Call OpenAI and Claude models for chat, structured output and tool use"
      - "Compare providers on one task with one harness"
      - "Reason about cost, latency and failure modes"
    stack: [OpenAI, Anthropic, Hugging Face, Pydantic]
  m09:
    n: 9
    slug: 09-preference-learning
    day: 3
    minutes: 95
    title: "Reinforcement and preference learning"
    summary: "Text generation as a reinforcement-learning problem, the policy gradient, and reward models learned from comparisons."
    objectives:
      - "Frame text generation as a reinforcement-learning problem"
      - "Derive and implement the policy gradient"
      - "Train a reward model from pairwise preferences"
    stack: [PyTorch, Hugging Face]
  m10:
    n: 10
    slug: 10-rlhf
    day: 3
    minutes: 95
    title: "RLHF"
    summary: "The full reinforcement-learning-from-human-feedback pipeline, DPO, and the ways it goes wrong."
    objectives:
      - "Describe the three-stage RLHF pipeline"
      - "Optimize a small LM against a reward model with a KL constraint"
      - "Apply DPO and compare"
      - "Name RLHF's failure modes and observe one"
    stack: [PyTorch, Hugging Face]
  m11:
    n: 11
    slug: 11-calibration
    day: 3
    minutes: 95
    title: "Calibration"
    summary: "What a probability should mean, how to measure it, and how to use confidence to decide when to abstain."
    objectives:
      - "Say what a probability should mean"
      - "Measure calibration with reliability diagrams, ECE and the Brier score"
      - "Explain proper scoring rules"
      - "Use confidence to decide when to abstain"
    stack: [PyTorch, scikit-learn, OpenAI, Anthropic]
  m12:
    n: 12
    slug: 12-rlcd-jev
    day: 3
    minutes: 95
    title: "RLCD and Jev"
    summary: "Reinforcement learning for calibrated decisions: what is public, what is not, and using a calibrated decision model through its API."
    objectives:
      - "State how RLCD's objective differs from RLHF's, and what is and is not public about it"
      - "Call Jev for typed decisions"
      - "Turn its probabilities into act, ask and escalate thresholds from stated costs"
    stack: [PyTorch, TypeSafe SDK]
  m13:
    n: 13
    slug: 13-rag
    day: 4
    minutes: 95
    title: "Retrieval-augmented generation"
    summary: "Building a RAG pipeline with LlamaIndex and LangChain, and evaluating retrieval and answers separately."
    objectives:
      - "Build a RAG pipeline"
      - "Choose chunking, embedding and reranking settings from measurements"
      - "Evaluate retrieval and answer quality separately"
    stack: [LlamaIndex, LangChain, Jev]
  m14:
    n: 14
    slug: 14-agents
    day: 4
    minutes: 95
    title: "Agents"
    summary: "Tool-using agents as explicit graphs in LangGraph, with state, human-in-the-loop interrupts and confidence-gated control."
    objectives:
      - "Build a tool-using agent as an explicit graph"
      - "Add state, memory and human-in-the-loop interrupts"
      - "Use a calibrated decision model for routing and tool-call approval"
    stack: [LangChain, LangGraph, Jev]
  m15:
    n: 15
    slug: 15-capstone
    day: 4
    minutes: 190
    title: "Capstone"
    summary: "Combine retrieval, an agent graph and calibrated control into one system, evaluate it, and explain the design."
    objectives:
      - "Combine retrieval, an agent graph and calibrated control into one system"
      - "Evaluate it for accuracy, abstention and cost"
      - "Explain the design choices to others"
    stack: [LlamaIndex, LangGraph, Jev, OpenAI, Anthropic]
