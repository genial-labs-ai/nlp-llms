  clis:
    claude_code: "@anthropic-ai/claude-code"
    codex: "@openai/codex"
    gemini: "@google/gemini-cli"
  # Each npm package's engines.node.
  node:
    claude_code: ">=22.0.0"
    codex: ">=16"
    gemini: ">=20"

# `notebook: false` marks a module with no Colab lab (Module 0 runs in the
# participant's own terminal). Every other module has notebooks/<slug>.ipynb.
modules:
  m00:
    n: 0
    slug: 00-coding-agents
    day: 0
    minutes: 60
    notebook: false
    title: "Coding agents in the terminal"
    summary: "Install a terminal coding agent and use it to build, check and publish two small data apps in Python or R, each with a three.js page. Pre-work, on your own laptop before Day 1."
    objectives:
      - "Install and drive a terminal coding agent"
      - "Build and check two small data apps with it"
      - "Publish them with GitHub and GitHub Pages"
    stack: [Claude Code, Codex, Gemini CLI, git, GitHub CLI, Python or R, three.js]
    readiness:
      lecture: drafted
      lab: none
      runtime: own-laptop
      estimate_minutes: 90
      accounts: [GitHub]
      optional_accounts: [Claude Code, Codex, Gemini CLI]
      cost: "Claude Code and Codex need a paid plan; Gemini CLI has a free tier with a personal Google account"
      fallback: {kind: none, note: "Pair with a neighbor, or use Gemini CLI's free tier"}
      gaps: "Never run end to end on a fresh laptop; its section minutes and its estimate (which adds one-time setup and the Pages build) are plans, not measurements"
  m01:
    n: 1
    slug: 01-text-as-data
    day: 1
    minutes: 95
    title: "Text as data"
    summary: "Tokenization, n-gram language models, TF-IDF and linear classifiers: the count-based baseline everything else is measured against."
    objectives:
      - "Tokenize text and justify the choices"
      - "Build and evaluate an n-gram language model"
      - "Train a linear text classifier and read its errors"
    stack: [NumPy, scikit-learn]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-cpu
      estimate_minutes: 2
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "Runs fully on a CPU"}
  m02:
    n: 2
    slug: 02-word-vectors
    day: 1
    minutes: 95
    title: "Word vectors and neural networks"
    summary: "From one-hot vectors to learned embeddings, with a PyTorch refresher and the first neural language model."
    objectives:
      - "Explain the distributional hypothesis and find nearest neighbors by cosine similarity"
      - "Derive the skip-gram negative-sampling loss, implement it, and check its gradients against autograd"
      - "Assemble a feed-forward classifier over averaged embeddings and evaluate it against TF-IDF"
    stack: [PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 10
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "Runs fully; a CPU runtime is slower"}
  m03:
    n: 3
    slug: 03-sequence-models
    day: 1
    minutes: 95
    title: "Sequence models"
    summary: "RNNs, LSTMs and neural language modeling, and why gradients vanish over long sequences."
    objectives:
      - "Implement the RNN and LSTM cell updates and the language-model loss"
      - "Explain vanishing gradients and how gating addresses them, from measured gradient decay"
      - "Evaluate the LSTM against the n-gram baseline in a like-for-like perplexity comparison"
    stack: [PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 10
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "QUICK = True trains a quarter of the steps of the same model"}
  m04:
    n: 4
    slug: 04-seq2seq-attention
    day: 1
    minutes: 95
    title: "Seq2seq and attention"
    summary: "Encoder-decoder models, the fixed-vector bottleneck, and attention as the fix."
    objectives:
      - "Assemble an encoder-decoder's teacher-forced forward pass and loss"
      - "Explain the fixed-vector bottleneck and measure it by input length"
      - "Implement dot-product and additive attention and read attention maps against the expected alignment"
    stack: [PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 10
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "QUICK = True trains 500 steps and skips the accuracy checkpoints"}
  m05:
    n: 5
    slug: 05-transformer-from-scratch
    day: 2
    minutes: 120
    title: "The transformer"
    summary: "Self-attention, multi-head attention and positional encodings, assembled into a small GPT."
    objectives:
      - "Implement scaled dot-product attention with a causal mask"
      - "Inspect how heads, blocks and positions assemble into a decoder-only transformer"
      - "Train a small GPT with the provided loop and evaluate it against the LSTM"
    stack: [PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 10
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "On a CPU runtime the lab switches itself to QUICK"}
  m06:
    n: 6
    slug: 06-pretraining-huggingface
    day: 2
    minutes: 120
    title: "Pretraining and the Hugging Face stack"
    summary: "Subword tokenization, masked and causal pretraining, and using pretrained models through Hugging Face."
    objectives:
      - "Explain subword tokenization and the masked and causal pretraining objectives"
      - "Load, inspect and run pretrained models with Hugging Face"
      - "Configure a supplied fine-tuning run for an encoder classifier and evaluate it against Labs 1 and 2"
    stack: [Hugging Face, PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 7
      accounts: [Google]
      cost: free
      fallback: {kind: open-model, note: "On a CPU runtime, BERT-mini fine-tunes on 800 training texts: a real, smaller model. There is no path without the Hugging Face Hub"}
      gaps: "The Lab 6 logits file that Lab 11 reads has not been built"
  m07:
    n: 7
    slug: 07-finetuning-lora
    day: 2
    minutes: 120
    title: "Fine-tuning and LoRA"
    summary: "Turning a pretrained language model into an instruction follower, efficiently."
    objectives:
      - "Turn a pretrained causal LM into an instruction follower"
      - "Apply LoRA and explain why it works"
      - "Choose decoding settings and evaluate generated text"
    stack: [Hugging Face, PEFT, PyTorch]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 7
      accounts: [Google]
      cost: free
      fallback: {kind: open-model, note: "On a CPU runtime, FAST runs a shorter fine-tune of the same SmolLM2-135M. There is no path without the Hugging Face Hub"}
  m08:
    n: 8
    slug: 08-llm-apis
    day: 3
    minutes: 120
    title: "LLMs through APIs"
    summary: "OpenAI and Claude side by side: prompting, structured output, tool use, cost and evaluation."
    objectives:
      - "Use one provider-agnostic wrapper for chat, structured output and tool use, on OpenAI, Claude or an open model"
      - "Implement an evaluation harness and score a provider with it; compare OpenAI and Claude when both keys are set"
      - "Reason about cost, latency and failure modes"
    stack: [OpenAI, Anthropic, Hugging Face, Pydantic]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-t4
      estimate_minutes: 3
      accounts: [Google]
      optional_accounts: [OpenAI, Anthropic]
      cost: "Free without keys. Keyed run: under 25 cents on Claude, under 5 cents on OpenAI (estimates)"
      fallback: {kind: open-model, note: "Qwen2.5-0.5B-Instruct answers in place of OpenAI and Claude; its numbers describe Qwen, not the commercial models"}
  m09:
    n: 9
    slug: 09-preference-learning
    day: 3
    minutes: 120
    title: "Reinforcement and preference learning"
    summary: "Text generation as a reinforcement-learning problem, the policy gradient, and reward models learned from comparisons."
    objectives:
      - "Frame text generation as a reinforcement-learning problem"
      - "Derive and implement the policy gradient"
      - "Train a reward model from pairwise preferences"
    stack: [PyTorch, Hugging Face]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-cpu
      estimate_minutes: 10
      accounts: [Google]
      cost: free
      fallback: {kind: none, note: "Part A runs anywhere; Part B loads the committed Lab 9 data files and downloads no model"}
      gaps: "Part B and its Exercise 4 thresholds were measured on the build Mac's CPU only (2026-10-06), not on Colab or a GPU"
  m10:
    n: 10
    slug: 10-rlhf
    day: 3
    minutes: 120
    title: "RLHF"
    summary: "The full reinforcement-learning-from-human-feedback pipeline, DPO, and the ways it goes wrong."
    objectives:
      - "Describe the three-stage RLHF pipeline"
      - "Optimize a small LM against a reward model with a KL constraint"
      - "Apply DPO and compare"
      - "Name RLHF's failure modes and observe one"
    stack: [PyTorch, Hugging Face]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-t4
      estimate_minutes: 7
      accounts: [Google]
      cost: free
      fallback: {kind: open-model, note: "On a CPU runtime, FAST runs short smoke trainings of the same GPT-2; the trained-policy checkpoints are skipped, so reward hacking is not shown"}
      gaps: "The trained-policy checkpoints, including the reward-hacking signature, need a GPU; the seed protocol (seeds 0 to 4 on a T4) has not run, so their thresholds are provisional. On the build Mac the CPU FAST path ran, plus one exploratory full-settings run on its GPU (MPS) from a scratch copy (2026-10-06)"
  m11:
    n: 11
    slug: 11-calibration
    day: 4
    minutes: 120
    title: "Calibration"
    summary: "What a probability should mean, how to measure it, and how to use confidence to decide when to abstain."
    objectives:
      - "Say what a probability should mean"
      - "Measure calibration with reliability diagrams, ECE and the Brier score"
      - "Explain proper scoring rules"
      - "Use confidence to decide when to abstain"
    stack: [PyTorch, scikit-learn, OpenAI, Anthropic]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-cpu
      estimate_minutes: 7
      accounts: [Google]
      optional_accounts: [OpenAI, Anthropic]
      cost: "Free without keys. Keyed run: under 1 USD on Claude, under 25 cents on OpenAI (estimates)"
      fallback: {kind: open-model, note: "Qwen2.5-0.5B-Instruct answers on a fixed subset; its numbers describe Qwen, not the commercial models"}
      gaps: "Until the Lab 6 logits are built, Part A analyzes the Lab 1 classifier instead of the fine-tuned encoder"
  m12:
    n: 12
    slug: 12-rlcd-jev
    day: 4
    minutes: 120
    title: "Calibrated decisions: RLCD and Jev"
    summary: "Training and using models for calibrated decisions: outcome rewards, thresholds from costs, and TypeSafe's RLCD and Jev as a case study in what is and is not public."
    objectives:
      - "Implement an accuracy reward and a proper-score reward, and explain from a toy model why only the second pays for honest probabilities"
      - "Implement act, ask and escalate thresholds from stated costs, and choose them on development data"
      - "State what is and is not public about RLCD, and evaluate a decision model's answers by their probabilities, not their confidence field"
    stack: [PyTorch, TypeSafe SDK]
    readiness:
      lecture: reviewed
      lab: written
      runtime: colab-cpu
      estimate_minutes: 3
      accounts: [Google]
      optional_accounts: [TypeSafe, OpenAI, Anthropic]
      cost: "Free without keys. Keyed run: under 5 cents on Jev; the stretch adds under 25 cents on Claude (estimates)"
      fallback: {kind: toy, note: "A small decision model trained in the lab answers in Jev's place. It is labeled 'not Jev', and its numbers say nothing about Jev"}
      gaps: "TypeSafe's documentation was read on 2026-10-06 and quoted in lecture 12; the quotations await sign-off, and no live Jev call has been made"
  m13:
    n: 13
    slug: 13-rag
    day: 4
    minutes: 120
    title: "Retrieval-augmented generation"
    summary: "Building a RAG pipeline with LlamaIndex and LangChain, and evaluating retrieval and answers separately."
    objectives:
      - "Assemble a RAG pipeline in LlamaIndex and LangChain"
      - "Implement recall@k and MRR, and choose chunk size and top-k from a measured sweep"
      - "Evaluate retrieval and answer quality separately"
    stack: [LlamaIndex, LangChain, Jev]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-t4
      estimate_minutes: 8
      accounts: [Google]
      optional_accounts: [OpenAI, Anthropic, TypeSafe]
      cost: "Free without keys. Keyed run: under 50 cents on Claude, under 5 cents on OpenAI, under 5 cents on Jev (estimates)"
      fallback: {kind: open-model, note: "bge-small, a cross-encoder, an NLI model and Qwen replace the commercial models and Jev; their numbers describe those models"}
      gaps: "The 80 human-written questions do not exist; runs use plumbing probes, which test the code, not retrieval"
  m14:
    n: 14
    slug: 14-agents
    day: 5
    minutes: 120
    title: "Agents"
    summary: "Tool-using agents as explicit graphs in LangGraph, with state, human-in-the-loop interrupts and confidence-gated control."
    objectives:
      - "Assemble a tool-using agent as an explicit graph by writing its routing edges"
      - "Drive human-in-the-loop interrupts, and replay and fork a checkpointed run"
      - "Use a calibrated decision model for routing and tool-call approval, with thresholds from costs"
    stack: [LangChain, LangGraph, Jev]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-t4
      estimate_minutes: 6
      accounts: [Google]
      optional_accounts: [OpenAI, Anthropic, TypeSafe]
      cost: "Free without keys. Keyed run: under 30 cents on Claude, under 5 cents on OpenAI, under 5 cents on Jev (estimates)"
      fallback: {kind: open-model, note: "Qwen2.5-0.5B-Instruct runs the agent and the guard, and Module 12's toy decision model routes; their numbers describe those models, not Jev or the commercial models"}
  m15:
    n: 15
    slug: 15-capstone
    day: 5
    minutes: 240
    title: "Capstone"
    summary: "Combine retrieval, an agent graph and calibrated control into one system, evaluate it, and explain the design."
    objectives:
      - "Combine retrieval, an agent graph and calibrated control into one system"
      - "Evaluate it for accuracy, abstention and cost"
      - "Explain the design choices to others"
    stack: [LlamaIndex, LangGraph, Jev, OpenAI, Anthropic]
    readiness:
      lecture: drafted
      lab: written
      runtime: colab-t4
      estimate_minutes: 15
      accounts: [Google]
      optional_accounts: [OpenAI, Anthropic, TypeSafe]
      cost: "Free without keys. Keyed, per pair for the capstone: under 2 USD on Claude, under 25 cents on OpenAI, under 10 cents on Jev (estimates)"
      fallback: {kind: open-model, note: "Qwen, the open retrievers and the NLI judge replace the commercial models and Jev; their numbers describe those models"}
      gaps: "The 125-question evaluation set does not exist; runs use plumbing probes, which test the code, not the system"
