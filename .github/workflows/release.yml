name: Release

# A GitHub Release says "ready to teach" for one commit. It is created only when
# scripts/release_check.py finds no blockers: the setup notebook and every lab have a
# passing run of their current code on their own teaching runtime within
# readiness.max_run_age_days, and every readiness item is closed. The site deploys from main regardless
# (publish.yml); this gates the Release, not the deploy.
#
# Push a tag such as v2026.11 to release that commit, or run this workflow by hand
# to see the blockers without releasing (dry_run, the default for a manual run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the blockers; do not create a Release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # shell: bash adds pipefail, so tee does not hide the check's exit status.
      - name: Release check
        shell: bash
        run: uv run --locked --group site python scripts/release_check.py | tee release-check.txt

      # Also when the check fails: the list of blockers is what a dry run is for.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check
          path: release-check.txt

  release:
    needs: check
    # Only from a tag: a manual run from a branch is a dry run whatever the box says.
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: release-check

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG: ready to teach" --notes-file release-check.txt --verify-tag
