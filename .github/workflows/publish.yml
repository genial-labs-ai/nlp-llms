name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/test_rag_questions.py rebuilds the Lab 13 corpus snapshot from
      # its recorded source commit and skips that test in a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # The render job's steps run outside the project (--no-project, uvx), so they do not
      # resolve the execute group's ML stack: a docs-only change never waits on the PyTorch
      # index. The --with lists mirror the site/test/lint groups in pyproject.toml.
      - name: Regenerate derived files and fail on drift
        run: |
          uv run --no-project --with pyyaml --with nbformat python scripts/gen_tables.py
          uv run --no-project --with pyyaml --with nbformat python scripts/gen_notebooks.py
          DRIFT=$(git status --porcelain -- notebooks _includes lectures README.md)
          if [ -n "$DRIFT" ]; then
            echo "Generated files are out of date. Run the generators and commit:"
            echo "$DRIFT"
            git diff -- notebooks _includes lectures README.md
            exit 1
          fi

      - name: Lint
        run: |
          uvx --from "ruff>=0.6" ruff check scripts tests data agents-intro
          uvx --from "ruff>=0.6" ruff format --check scripts tests data agents-intro

      # Tests that need torch or typesafe-sdk skip here and run in the notebooks job.
      - name: Test
        run: uv run --no-project --with pyyaml --with nbformat python -m unittest discover -s tests -v

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Check internal links
        run: uv run --no-project --with pyyaml --with nbformat python scripts/check_links.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The offline-path flags, shared by the worked run and the learner smoke test below.
    env:
      MPLBACKEND: Agg
      # Shortens the from-scratch training runs (Labs 3, 4 and 5) on this CPU runner.
      NLP_LLMS_QUICK: "1"
      NLP_LLMS_CELL_TIMEOUT: "1800"
      OMP_NUM_THREADS: "4"
      # Fail fast if any lab reaches for the Hub that its flag below should have stopped.
      HF_HUB_OFFLINE: "1"
      # Lab 6: tiny random encoder and causal LM instead of the Hub checkpoints.
      NLP_LLMS_OFFLINE_TINY: "1"
      # Lab 7: random stand-in for SmolLM2 and synthetic data instead of Dolly.
      NLP_LLMS_LAB07_OFFLINE: tiny
      # Labs 8 and 11 (and 13, 14): Lab 8's StubProvider instead of the open chat model.
      NLP_LLMS_STUB: "1"
      # Labs 9 and 10 need GPT-2's tokenizer and model from the Hub even with Lab 9's data
      # committed, so this hermetic job runs their labeled offline stand-ins; the hub leg of
      # health.yml runs them for real.
      NLP_LLMS_LAB09_OFFLINE: tiny
      NLP_LLMS_LAB10_OFFLINE: tiny
      # Lab 13: BM25 plus labeled stand-ins until its human question set exists.
      NLP_LLMS_LAB13_OFFLINE: "1"
      NLP_LLMS_LAB14_OFFLINE: "1"
      # Lab 15 (capstone): stub path on plumbing probes until its question set exists.
      NLP_LLMS_LAB15_OFFLINE: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # The unit tests again, with torch and typesafe-sdk installed: the Lab 9 offline
      # build and the Lab 12 local-decider tests skip in the render job without them.
      # --locked also fails if uv.lock no longer matches pyproject.toml.
      - name: Unit tests with the lab dependencies
        env:
          UV_LINK_MODE: copy
        run: uv run --locked --group execute --group test python -m unittest discover -s tests

      # Hermetic: no API keys and no Hugging Face Hub, so a pull request never fails
      # because huggingface.co is slow or rate-limited. Every lab runs its offline test
      # path (random stand-in models, test doubles, labeled stand-in data; their numbers
      # are not results). The open-model paths run in health.yml (weekly, and on demand).
      # Keep the flags in step with the "offline" leg of health.yml.
      - name: Execute notebooks
        # Each exercise's first checkpoint also runs on its unfinished stub, where it must
        # fail (the same check as the offline leg of health.yml).
        run: uv run --locked --group execute python scripts/test_notebooks.py --verify-checkpoints

      # The same notebooks, run as a participant who has written nothing: each lab must
      # stop at a checkpoint with the harness's recovery message, never pass on the
      # reference solutions, and never fail first in a provided cell.
      - name: Learner smoke test
        run: uv run --locked --group execute python scripts/test_notebooks.py --learner

  # Desktop sizes in both themes: no sideways scroll, math typeset, demos drawn,
  # answers reachable and operable from the keyboard. Its own job, on the site the
  # render job built: the demos load Plot from a CDN, and a CDN hiccup here must not
  # hold up the deploy, which needs only the render job.
  browser:
    needs: render
    runs-on: ubuntu-latest
    # About 3 minutes when the CDNs answer; a hanging one makes every demo wait.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@v7
        with:
          name: github-pages

      - name: Unpack the rendered site
        run: mkdir -p docs && tar -xf artifact.tar -C docs

      # Mirrors the browser group in pyproject.toml.
      - name: Check in a desktop browser
        run: |
          uv run --no-project --with "playwright>=1.63" playwright install --with-deps chromium
          uv run --no-project --with "playwright>=1.63" python scripts/check_browser.py

  deploy:
    needs: render
    # Needs Pages set to deploy from GitHub Actions (Settings > Pages > Source).
    # Runs on main only, for a push or a manual run, and never in a fork.
    if: >-
      github.repository == 'project-delphi/nlp-llms' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
