# Keeps the Genial Labs mirror (genial-labs-ai/nlp-llms) equal to the canonical
# repository's main branch, then deploys it at https://genial-labs-ai.github.io/nlp-llms/.
#
# The mirror is a plain copy, not a fork: pull requests go to project-delphi/nlp-llms.
# This workflow does nothing anywhere but in the mirror. It fast-forwards main from the
# canonical repository (a public read, no secret) and pushes with the job's own token.
# A push made with GITHUB_TOKEN starts no other workflow, so it then dispatches
# publish.yml itself, whose deploy job accepts the mirror. It dispatches whenever the
# last successful Publish run on main is not the current revision, so a deploy that
# failed is retried on the next run, and a manual run always redeploys.
#
# GitHub disables a scheduled workflow after 60 days without a push to the repository;
# the mirror's pushes are the canonical repository's commits, so a quiet two months
# stops the schedule. Run it by hand (Actions > Mirror > Run workflow) to re-enable it.
#
# The schedule fires in the canonical repository too, where the job is skipped; every
# four hours keeps that noise in its Actions list small. Run the mirror by hand after a
# merge that must appear at once.
name: Mirror

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Discard the mirror's own commits and force main to the canonical main"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'genial-labs-ai/nlp-llms'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from the canonical repository
        id: sync
        env:
          RESET: ${{ inputs.reset && 'true' || 'false' }}
        run: |
          git fetch https://github.com/project-delphi/nlp-llms.git main
          before=$(git rev-parse HEAD)
          if [ "$RESET" = "true" ]; then
            git reset --hard FETCH_HEAD
            git push --force origin main
          elif ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::main has commits that project-delphi/nlp-llms does not; run this workflow with 'reset' ticked"
            exit 1
          else
            git merge --ff-only FETCH_HEAD
            if [ "$before" != "$(git rev-parse HEAD)" ]; then
              git push origin main
            fi
          fi
          after=$(git rev-parse HEAD)
          deployed=$(gh run list --workflow publish.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          echo "before=$before after=$after last-successful-publish=${deployed:-none}"
          if [ "$after" != "$deployed" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the current revision
        if: steps.sync.outputs.deploy == 'true'
        run: gh workflow run publish.yml --ref main
