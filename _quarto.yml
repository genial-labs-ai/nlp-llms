project:
  type: website
  output-dir: docs
  # Explicit render list. Without it Quarto would try to execute
  # notebooks/*.ipynb and would render README.md, PLAN.md and AGENTS.md as pages.
  render:
    - index.qmd
    - setup.qmd
    - schedule.qmd
    - day-1.qmd
    - day-2.qmd
    - day-3.qmd
    - day-4.qmd
    - day-5.qmd
    - lectures/*.qmd
    - notebooks.qmd
    - references.qmd
    - teach.qmd
    - facilitator-guide.md
    - instructor-pace.md
    - assessments.md
    - faq.qmd
    - readiness.qmd
  # Copied to the site as files. Globs are anchored with a leading `/` so they
  # cannot match anything inside .venv/.
  resources:
    - /.nojekyll
    - /notebooks/*.ipynb
    - /fonts/**

# website.sidebar (the modules grouped by day) is generated from _variables.yml.
metadata-files:
  - _includes/sidebar.yml

website:
  title: "NLP to LLMs"
  description: "A five-day workshop on the path from traditional NLP to modern LLMs: n-grams, attention, transformers, RLHF, RLCD and agents."
  site-url: https://project-delphi.github.io/nlp-llms
  repo-url: https://github.com/project-delphi/nlp-llms
  open-graph: true
  # Previous/next module links at the foot of each lecture, in sidebar order.
  page-navigation: true
  # The module header already names the day; no breadcrumb line above the title.
  bread-crumbs: false
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: schedule.qmd
        text: Schedule
      - text: Days
        menu:
          # Module 0 is pre-work; Day 1 opens at 08:00 with an optional drop-in clinic for it.
          # The day texts are "Day N · " + days.dN.short (tests/test_variables.py).
          - href: lectures/00-coding-agents.qmd
            text: "Before Day 1 · Module 0 (pre-work)"
          - href: day-1.qmd
            text: "Day 1 · Foundations"
          - href: day-2.qmd
            text: "Day 2 · Transformers and pretraining"
          - href: day-3.qmd
            text: "Day 3 · Using and aligning LLMs"
          - href: day-4.qmd
            text: "Day 4 · Calibration, decisions, RAG"
          - href: day-5.qmd
            text: "Day 5 · Agents and capstone"
      - href: notebooks.qmd
        text: Notebooks
      - href: setup.qmd
        text: Setup
      - href: references.qmd
        text: References
      - href: teach.qmd
        text: Teach
      - href: faq.qmd
        text: FAQ
    right:
      - icon: github
        href: https://github.com/project-delphi/nlp-llms
        aria-label: "Source on GitHub"
  page-footer:
    left: "From Traditional NLP to Modern LLMs · Genial Labs · Built with [Quarto](https://quarto.org)"
    right: "Text CC BY 4.0 · Code MIT"

format:
  html:
    # custom.scss holds the light palette and every rule; custom-dark.scss only
    # overrides the palette. Quarto adds the light/dark toggle to the navbar.
    theme:
      light: [cosmo, custom.scss]
      dark: [cosmo, custom.scss, custom-dark.scss]
    # The @font-face rules sit beside the font files they name.
    css:
      - fonts/fonts.css
    # First visit: follow the operating system's light/dark setting. Quarto 1.6
    # reads only this stored value; the navbar toggle overwrites it.
    include-in-header:
      text: |
        <script>
        try {
          if (localStorage.getItem("quarto-color-scheme") === null &&
              matchMedia("(prefers-color-scheme: dark)").matches) {
            localStorage.setItem("quarto-color-scheme", "alternate");
          }
        } catch (e) {}
        </script>
    # The text column stays 800 px wide, as before the sidebar: lecture demos
    # place two 360 px plots side by side, and the longest equations need it.
    grid:
      sidebar-width: 240px
      body-width: 850px
      margin-width: 220px
      gutter-width: 1.5rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    # An adaptive style: Quarto emits a light and a dark variant.
    highlight-style: a11y
    html-math-method: katex
    link-external-newwindow: true
    # Adds classes to lecture markup (section objectives, optional callouts).
    filters:
      - at: pre-ast
        path: filters/pedagogy.lua
      - at: pre-ast
        path: filters/live.lua
