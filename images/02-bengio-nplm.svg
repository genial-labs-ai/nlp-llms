<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
  <title id="t">Bengio&#x27;s neural probabilistic language model</title>
  <desc id="d">Left to right: three context words are each looked up in the same embedding matrix E; the three embeddings are concatenated into x; a tanh hidden layer gives h; a softmax over the vocabulary gives the next-word distribution.</desc>
  <style>
