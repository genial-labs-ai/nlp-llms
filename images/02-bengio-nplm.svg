  <line class="ln" x1="80" y1="205" x2="108" y2="205" marker-end="url(#a)"/>
  <rect class="abox" x="110" y="187" width="40" height="36" rx="6"/>
  <text x="130" y="211" text-anchor="middle" class="m " style="font-size:18px"><tspan class="i">E</tspan></text>
  <line class="ln" x1="150" y1="205" x2="183" y2="205" marker-end="url(#a)"/>
  <rect class="box" x="185" y="197" width="14" height="16" rx="0"/>
