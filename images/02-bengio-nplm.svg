  <text x="287" y="254" text-anchor="middle" class="note">concatenate</text>
  <text x="287" y="274" text-anchor="middle" class="m " style="font-size:15px"><tspan>(</tspan><tspan class="i">n</tspan><tspan>−1)</tspan><tspan class="i">d</tspan></text>
  <line class="ln" x1="296" y1="150" x2="338" y2="150" marker-end="url(#a)"/>
  <text x="316" y="141" text-anchor="middle" class="m " style="font-size:16px"><tspan class="i">W</tspan><tspan dy="3.8" font-size="10.9">1</tspan></text>
