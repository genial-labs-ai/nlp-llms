    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
  </defs>
  <rect x="100" y="52" width="60" height="186" rx="10" fill="none" stroke="#b3541e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="130" y="26" text-anchor="middle" class="note acc">one shared</text>
  <text x="130" y="43" text-anchor="middle" class="note acc">matrix <tspan class="m i" font-size="16">E</tspan></text>
  <text x="45" y="43" text-anchor="middle" class="note">context</text>
