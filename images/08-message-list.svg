<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-labelledby="t d">
  <title id="t">The message list: stateless requests</title>
  <desc id="d">Left, the client: a vertical stack of message cards labeled system, user, assistant, user. An arrow labeled request: the whole list goes to the provider, which applies the chat template, turns the text into tokens and runs the transformer. An arrow labeled response: text, stop reason and usage (n_in, n_out) comes back, and the reply is appended to the client's stack as a new assistant card. The provider keeps nothing between requests; the list lives on the client and grows.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .s { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .i { font-style: italic; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .dim { fill: #f4f6f9; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .dln { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
    .panel { fill: #fafbfc; stroke: #c5ced8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
  </defs>
  <rect width="720" height="336" rx="8" fill="#ffffff"/>
  <rect class="panel" x="16" y="36" width="234" height="284" rx="12"/>
  <text x="133" y="60" text-anchor="middle" class="b" style="font-size:14px">client (your code)</text>
  <rect class="panel" x="470" y="36" width="234" height="284" rx="12"/>
  <text x="587" y="60" text-anchor="middle" class="b" style="font-size:14px">provider (server)</text>
  <rect class="op" x="36" y="76" width="194" height="32" rx="5"/>
  <text x="48" y="97" text-anchor="start" class="b" style="font-size:13px">system</text>
  <rect x="130" y="89" width="84" height="6" rx="3" fill="#c5ced8"/>
  <rect class="op" x="36" y="116" width="194" height="32" rx="5"/>
  <text x="48" y="137" text-anchor="start" class="b" style="font-size:13px">user</text>
  <rect x="130" y="129" width="84" height="6" rx="3" fill="#c5ced8"/>
  <rect class="op" x="36" y="156" width="194" height="32" rx="5"/>
  <text x="48" y="177" text-anchor="start" class="b" style="font-size:13px">assistant</text>
  <rect x="130" y="169" width="84" height="6" rx="3" fill="#c5ced8"/>
  <rect class="op" x="36" y="196" width="194" height="32" rx="5"/>
  <text x="48" y="217" text-anchor="start" class="b" style="font-size:13px">user</text>
  <rect x="130" y="209" width="84" height="6" rx="3" fill="#c5ced8"/>
  <rect class="abox" x="36" y="240" width="194" height="32" rx="5"/>
  <text x="48" y="261" text-anchor="start" class="b" style="font-size:13px">assistant</text>
  <text x="218" y="261" text-anchor="end" class="note acc" style="font-size:12.5px">the reply</text>
  <text x="133" y="300" text-anchor="middle" class="note">the list lives here and grows</text>
  <rect class="box" x="512" y="84" width="150" height="32" rx="6"/>
  <text x="587" y="105" text-anchor="middle" style="font-size:14px">chat template</text>
  <line class="ln" x1="587" y1="116" x2="587" y2="138" marker-end="url(#a)"/>
  <rect class="box" x="512" y="140" width="150" height="32" rx="6"/>
  <text x="587" y="161" text-anchor="middle" style="font-size:14px">tokens</text>
  <line class="ln" x1="587" y1="172" x2="587" y2="194" marker-end="url(#a)"/>
  <rect class="box" x="512" y="196" width="150" height="32" rx="6"/>
  <text x="587" y="217" text-anchor="middle" style="font-size:14px">transformer</text>
  <text x="587" y="284" text-anchor="middle" class="note">keeps nothing</text>
  <text x="587" y="301" text-anchor="middle" class="note">between requests</text>
  <line class="ln" x1="250" y1="100" x2="510" y2="100" marker-end="url(#a)"/>
  <text x="360" y="90" text-anchor="middle" class="note">request: the whole list</text>
  <path class="aln" d="M587,228 V256 H232" marker-end="url(#b)"/>
  <text x="352" y="226" text-anchor="middle" class="note acc">response: text + stop reason</text>
  <text x="352" y="245" text-anchor="middle" class="m acc" style="font-size:14px"><tspan class="s">+ usage (</tspan><tspan class="i">n</tspan><tspan dy="3.4" font-size="9.5">in</tspan><tspan dy="-3.4" class="s">, </tspan><tspan class="i">n</tspan><tspan dy="3.4" font-size="9.5">out</tspan><tspan dy="-3.4" class="s">)</tspan></text>
</svg>
