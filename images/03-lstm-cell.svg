<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" width="680" height="376" role="img" aria-labelledby="t d">
  <title id="t">One LSTM cell</title>
  <desc id="d">The cell state runs along the top from c_{t-1} to c_t: it is multiplied elementwise by the forget gate f_t, then i_t times the candidate c-tilde_t is added. Below, h_{t-1} and x_t feed four boxes: f_t (sigmoid), i_t (sigmoid), c-tilde_t (tanh) and o_t (sigmoid). On the output path c_t passes through tanh and is multiplied by o_t to give h_t.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .i { font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
  </defs>
  <g transform="translate(0,-24)">
  <rect x="95" y="45" width="490" height="295" rx="14" fill="#fafbfc" stroke="#c5ced8" stroke-width="1.5"/>
  <line class="ln" x1="64" y1="310" x2="465" y2="310"/>
  <text x="36" y="316" text-anchor="middle" class="m " style="font-size:19px"><tspan class="i">h</tspan><tspan dy="4.6" font-size="12.9" class="i">t</tspan><tspan font-size="12.9">−1</tspan></text>
  <line class="ln" x1="140" y1="362" x2="140" y2="310"/>
  <circle cx="140" cy="310" r="3.2" fill="#16324f"/>
  <text x="140" y="386" text-anchor="middle" class="m " style="font-size:19px"><tspan class="i">x</tspan><tspan dy="4.6" font-size="12.9" class="i">t</tspan></text>
  <line class="ln" x1="200" y1="310" x2="200" y2="273" marker-end="url(#a)"/>
  <circle cx="200" cy="310" r="3.2" fill="#16324f"/>
  <rect class="box" x="168" y="225" width="64" height="46" rx="6"/>
  <text x="200" y="244" text-anchor="middle" class="m " style="font-size:18px"><tspan class="i">f</tspan><tspan dy="4.3" font-size="12.2" class="i">t</tspan></text>
  <text x="200" y="264" text-anchor="middle" class="m note" style="font-size:16px"><tspan class="i">σ</tspan></text>
  <line class="ln" x1="290" y1="310" x2="290" y2="273" marker-end="url(#a)"/>
  <circle cx="290" cy="310" r="3.2" fill="#16324f"/>
  <rect class="box" x="258" y="225" width="64" height="46" rx="6"/>
  <text x="290" y="244" text-anchor="middle" class="m " style="font-size:18px"><tspan class="i">i</tspan><tspan dy="4.3" font-size="12.2" class="i">t</tspan></text>
  <text x="290" y="264" text-anchor="middle" class="m note" style="font-size:16px"><tspan class="i">σ</tspan></text>
  <line class="ln" x1="375" y1="310" x2="375" y2="273" marker-end="url(#a)"/>
  <circle cx="375" cy="310" r="3.2" fill="#16324f"/>
  <rect class="box" x="343" y="225" width="64" height="46" rx="6"/>
  <text x="375" y="244" text-anchor="middle" class="m " style="font-size:18px"><tspan class="i">c̃</tspan><tspan dy="4.3" font-size="12.2" class="i">t</tspan></text>
  <text x="375" y="263" text-anchor="middle" class="note">tanh</text>
  <line class="ln" x1="465" y1="310" x2="465" y2="273" marker-end="url(#a)"/>
  <rect class="box" x="433" y="225" width="64" height="46" rx="6"/>
  <text x="465" y="244" text-anchor="middle" class="m " style="font-size:18px"><tspan class="i">o</tspan><tspan dy="4.3" font-size="12.2" class="i">t</tspan></text>
  <text x="465" y="264" text-anchor="middle" class="m note" style="font-size:16px"><tspan class="i">σ</tspan></text>
  <line class="ln" x1="200" y1="225" x2="200" y2="109" marker-end="url(#a)"/>
  <path class="ln" d="M290,225 V165 H316" marker-end="url(#a)"/>
  <path class="ln" d="M375,225 V165 H344" marker-end="url(#a)"/>
  <line class="ln" x1="330" y1="153" x2="330" y2="109" marker-end="url(#a)"/>
  <text x="342" y="137" text-anchor="start" class="m " style="font-size:17px"><tspan class="i">i</tspan><tspan dy="4.1" font-size="11.6" class="i">t</tspan><tspan dy="-4.1"> ⊙ </tspan><tspan class="i">c̃</tspan><tspan dy="4.1" font-size="11.6" class="i">t</tspan></text>
  <line class="aln" x1="66" y1="95" x2="616" y2="95" marker-end="url(#b)"/>
  <text x="36" y="101" text-anchor="middle" class="m " style="font-size:19px"><tspan class="i">c</tspan><tspan dy="4.6" font-size="12.9" class="i">t</tspan><tspan font-size="12.9">−1</tspan></text>
  <text x="645" y="101" text-anchor="middle" class="m " style="font-size:19px"><tspan class="i">c</tspan><tspan dy="4.6" font-size="12.9" class="i">t</tspan></text>
  <text x="440" y="78" text-anchor="middle" class="note acc">cell state: the additive path</text>
  <circle class="op" cx="200" cy="95" r="12"/>
  <circle cx="200" cy="95" r="2.8" fill="#16324f"/>
  <circle class="op" cx="330" cy="95" r="12"/>
  <path class="ln" d="M324,95 H336 M330,89 V101"/>
  <circle class="op" cx="330" cy="165" r="12"/>
  <circle cx="330" cy="165" r="2.8" fill="#16324f"/>
  <circle cx="530" cy="95" r="3.6" fill="#b3541e"/>
  <line class="ln" x1="530" y1="95" x2="530" y2="133" marker-end="url(#a)"/>
  <rect class="box" x="500" y="135" width="60" height="30" rx="15"/>
  <text x="530" y="155" text-anchor="middle" class="note" style="fill:#1f2933">tanh</text>
  <line class="ln" x1="530" y1="165" x2="530" y2="186" marker-end="url(#a)"/>
  <path class="ln" d="M465,225 V200 H516" marker-end="url(#a)"/>
  <circle class="op" cx="530" cy="200" r="12"/>
  <circle cx="530" cy="200" r="2.8" fill="#16324f"/>
  <path class="ln" d="M530,212 V285 H616" marker-end="url(#a)"/>
  <text x="645" y="291" text-anchor="middle" class="m " style="font-size:19px"><tspan class="i">h</tspan><tspan dy="4.6" font-size="12.9" class="i">t</tspan></text>
  <circle class="op" cx="250" cy="381" r="9"/>
  <circle cx="250" cy="381" r="2.8" fill="#16324f"/>
  <text x="266" y="386" text-anchor="start" class="note">elementwise product</text>
  <text x="404" y="386" text-anchor="start" class="m note" style="font-size:15px"><tspan>(⊙)</tspan></text>
  <circle class="op" cx="470" cy="381" r="9"/>
  <path class="ln" d="M464,381 H476 M470,375 V387"/>
  <text x="486" y="386" text-anchor="start" class="note">addition</text>
  </g>
</svg>
