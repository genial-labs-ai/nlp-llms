<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" width="720" height="596" role="img" aria-labelledby="t d">
  <title id="t">A pre-norm transformer block and the decoder-only model</title>
  <desc id="d">Left: one pre-norm block. A thick residual stream runs from H^(l-1) at the bottom to H^(l) at the top. The first branch leaves the stream, passes through layer normalization and masked multi-head attention, and is added back at a plus sign, giving H-prime. The second branch passes through layer normalization and the feed-forward network and is added back the same way. Below, an inset shows the original post-norm arrangement of one sublayer, where the sublayer output is added to the main line and the sum then passes through layer normalization on the main line itself. Right: the decoder-only model, bottom to top: tokens w_1 to w_T, token embedding plus position giving h_t^(0) = e_{w_t} + p_t, a stack of n_l pre-norm blocks, a final layer normalization, the output layer W_o, b_o, a softmax, and y-hat_t, the distribution over the next token w_{t+1}.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .s { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .i { font-style: italic; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .dim { fill: #f4f6f9; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .dln { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
    .panel { fill: #fafbfc; stroke: #c5ced8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
  </defs>
  <rect width="720" height="596" rx="8" fill="#ffffff"/>
  <rect class="panel" x="16" y="40" width="334" height="424" rx="12"/>
  <text x="183" y="28" text-anchor="middle" class="b">one pre-norm block</text>
  <line class="aln" x1="92" y1="422" x2="92" y2="264" style="stroke-width:4"/>
  <line class="aln" x1="92" y1="236" x2="92" y2="110" style="stroke-width:4"/>
  <line class="aln" x1="92" y1="82" x2="92" y2="62" marker-end="url(#e)" style="stroke-width:4"/>
  <text transform="translate(44,300) rotate(-90)" text-anchor="middle" class="note acc">residual stream</text>
  <text x="92" y="446" text-anchor="middle" class="m" style="font-size:19px"><tspan class="i">H</tspan><tspan dy="-6.8" font-size="12.9">(</tspan><tspan font-size="12.9" class="i">ℓ</tspan><tspan font-size="12.9">−1)</tspan></text>
  <text x="106" y="70" text-anchor="start" class="m" style="font-size:19px"><tspan class="i">H</tspan><tspan dy="-6.8" font-size="12.9">(</tspan><tspan font-size="12.9" class="i">ℓ</tspan><tspan font-size="12.9">)</tspan></text>
  <circle cx="92" cy="396" r="3.6" fill="#b3541e"/>
  <path class="ln" d="M92,396 H220 V374" marker-end="url(#a)"/>
  <rect class="box" x="180" y="346" width="80" height="26" rx="6"/>
  <text x="220" y="364" text-anchor="middle" style="font-size:14px">LN</text>
  <line class="ln" x1="220" y1="346" x2="220" y2="324" marker-end="url(#a)"/>
