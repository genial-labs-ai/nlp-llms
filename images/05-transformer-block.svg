  <text x="220" y="293" text-anchor="middle" style="font-size:14px">masked multi-head</text>
  <text x="220" y="311" text-anchor="middle" style="font-size:14px">attention</text>
  <path class="ln" d="M220,272 V250 H106" marker-end="url(#a)"/>
  <circle class="op" cx="92" cy="250" r="12"/><path class="ln" d="M86,250 H98 M92,244 V256"/>
  <text x="78" y="232" text-anchor="end" class="m" style="font-size:17px"><tspan class="i">H</tspan><tspan>′</tspan></text>
  <circle cx="92" cy="214" r="3.6" fill="#b3541e"/>
  <path class="ln" d="M92,214 H220 V192" marker-end="url(#a)"/>
  <rect class="box" x="180" y="164" width="80" height="26" rx="6"/>
  <text x="220" y="182" text-anchor="middle" style="font-size:14px">LN</text>
  <line class="ln" x1="220" y1="164" x2="220" y2="144" marker-end="url(#a)"/>
  <rect class="box" x="146" y="110" width="148" height="32" rx="6"/>
  <text x="220" y="131" text-anchor="middle" style="font-size:14px">feed-forward (FFN)</text>
  <path class="ln" d="M220,110 V96 H106" marker-end="url(#a)"/>
  <circle class="op" cx="92" cy="96" r="12"/><path class="ln" d="M86,96 H98 M92,90 V102"/>
  <text x="270" y="364" text-anchor="start" class="note">sublayer 1</text>
  <text x="270" y="182" text-anchor="start" class="note">sublayer 2</text>
  <rect class="panel" x="16" y="478" width="334" height="104" rx="12"/>
  <text x="30" y="500" text-anchor="start" class="note">post-norm (original): LN sits on the main line</text>
  <text x="34" y="561" text-anchor="start" class="note">in</text>
  <line class="aln" x1="54" y1="556" x2="228" y2="556"/>
  <circle cx="76" cy="556" r="3.6" fill="#b3541e"/>
  <path class="ln" d="M76,556 V522 H118" marker-end="url(#a)"/>
  <rect class="box" x="120" y="510" width="80" height="24" rx="6"/>
  <text x="160" y="527" text-anchor="middle" style="font-size:13.5px">sublayer</text>
  <path class="ln" d="M200,522 H240 V542" marker-end="url(#a)"/>
  <circle class="op" cx="240" cy="556" r="12"/><path class="ln" d="M234,556 H246 M240,550 V562"/>
  <line class="aln" x1="252" y1="556" x2="270" y2="556"/>
  <rect class="abox" x="272" y="543" width="40" height="26" rx="6"/>
  <text x="292" y="561" text-anchor="middle" style="font-size:14px">LN</text>
  <line class="aln" x1="312" y1="556" x2="334" y2="556" marker-end="url(#b)"/>
  <text x="326" y="540" text-anchor="middle" class="note">out</text>
  <rect class="panel" x="380" y="40" width="324" height="424" rx="12"/>
  <text x="542" y="28" text-anchor="middle" class="b">the model: decoder-only</text>
  <text x="542" y="452" text-anchor="middle" class="m" style="font-size:18px"><tspan class="i">w</tspan><tspan dy="4.3" font-size="12.2">1</tspan><tspan dy="-4.3"> … </tspan><tspan class="i">w</tspan><tspan dy="4.3" font-size="12.2" class="i">T</tspan></text>
  <line class="ln" x1="542" y1="434" x2="542" y2="414" marker-end="url(#a)"/>
  <rect class="box" x="432" y="366" width="220" height="46" rx="6"/>
  <text x="542" y="384" text-anchor="middle" style="font-size:14px">token embedding + position</text>
  <text x="542" y="404" text-anchor="middle" class="m" style="font-size:16px"><tspan class="i">h</tspan><tspan dy="3.8" font-size="10.9" class="i">t</tspan><tspan dy="-9.6" font-size="10.9">(0)</tspan><tspan dy="5.8"> = </tspan><tspan class="i">e</tspan><tspan dy="3.8" font-size="10.9" class="i">w</tspan><tspan dy="2.6" font-size="8.7" class="i">t</tspan><tspan dy="-6.4"> + </tspan><tspan class="i">p</tspan><tspan dy="3.8" font-size="10.9" class="i">t</tspan></text>
  <line class="ln" x1="542" y1="366" x2="542" y2="340" marker-end="url(#a)"/>
  <rect class="box" x="474" y="268" width="160" height="58" rx="6"/>
  <rect class="box" x="468" y="274" width="160" height="58" rx="6"/>
  <rect class="box" x="462" y="280" width="160" height="58" rx="6"/>
  <text x="542" y="306" text-anchor="middle" style="font-size:14px">pre-norm block</text>
  <text x="542" y="325" text-anchor="middle" class="note">(left panel)</text>
  <text x="664" y="306" text-anchor="start" class="m" style="font-size:18px"><tspan>× </tspan><tspan class="i">n</tspan><tspan dy="4.3" font-size="12.2" class="i">ℓ</tspan></text>
  <line class="ln" x1="542" y1="268" x2="542" y2="248" marker-end="url(#a)"/>
  <rect class="box" x="492" y="220" width="100" height="26" rx="6"/>
  <text x="542" y="238" text-anchor="middle" style="font-size:14px">final LN</text>
  <line class="ln" x1="542" y1="220" x2="542" y2="200" marker-end="url(#a)"/>
  <rect class="box" x="462" y="170" width="160" height="28" rx="6"/>
  <text x="542" y="190" text-anchor="middle" class="m" style="font-size:15px"><tspan class="s">output layer </tspan><tspan class="i">W</tspan><tspan dy="3.6" font-size="10.2" class="i">o</tspan><tspan dy="-3.6">, </tspan><tspan class="i">b</tspan><tspan dy="3.6" font-size="10.2" class="i">o</tspan></text>
  <line class="ln" x1="542" y1="170" x2="542" y2="150" marker-end="url(#a)"/>
  <rect class="box" x="502" y="122" width="80" height="26" rx="6"/>
  <text x="542" y="140" text-anchor="middle" style="font-size:14px">softmax</text>
  <line class="ln" x1="542" y1="122" x2="542" y2="102" marker-end="url(#a)"/>
  <text x="542" y="88" text-anchor="middle" class="m" style="font-size:16px"><tspan>ŷ</tspan><tspan dy="3.8" font-size="10.9" class="i">t</tspan><tspan dy="-3.8" class="s">: distribution over </tspan><tspan class="i">w</tspan><tspan dy="3.8" font-size="10.9" class="i">t</tspan><tspan font-size="10.9">+1</tspan></text>
  <path class="rule" d="M350,300 C400,300 420,309 460,309" style="stroke-dasharray:4 3"/>
</svg>
