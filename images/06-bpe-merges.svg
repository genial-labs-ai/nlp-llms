<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d">
  <title id="t">BPE merges on the toy corpus</title>
  <desc id="d">Four words, low (count 5), lower (2), newest (6) and widest (3), each drawn as a row of symbol boxes ending in the end-of-word symbol, underscore. Column 1, start: every symbol is one character and the vocabulary has 11 symbols. Column 2, after merge 3: e, s, t and underscore are fused into one box, est_, in newest and widest; 14 symbols. Column 3, after merge 5: l, o and w are fused into one box, low, in low and lower; 16 symbols. Below, the merge list in order: 1 e+s, 2 es+t, 3 est+_, 4 l+o, 5 lo+w.</desc>
