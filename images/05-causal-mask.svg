<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="t d">
  <title id="t">The causal mask on the attention weights</title>
  <desc id="d">A six by six grid for the characters T, o, space, b, e and comma. Rows are the asking position t, columns the position i that is read. Cells on and below the diagonal hold attention weights, shaded darker for larger values and printed as numbers; each row sums to 1, and row 1 is a single cell of weight 1. Cells above the diagonal are hatched: their scores are minus infinity before the softmax, so their weights are 0 after it. The weights are illustrative, not measured.</desc>
