<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-labelledby="t d">
  <title id="t">Illustrative attention weights for a date-conversion example</title>
  <desc id="d">Heat-map with one column per character of the source 3 March 2021 and one row per character of the target 2021-03-03. The year rows are bright over 2021 at the right, the month rows over March in the middle and the day rows over 3 at the left, so the bright cells run against the diagonal. Each row sums to 1. The weights are illustrative, not measured.</desc>
